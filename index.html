<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | webar-task7</title>
    <meta name="description" content="">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-canvas-container" style="width: 100%; height: 100%;">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;"></canvas>
      </div>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <button id="entervr" value="Enter VR" disabled>VR</button>
        <button id="enterar" value="Enter AR" disabled>AR</button>
        <div id="unity-webxr-link">Using <a href="https://github.com/De-Panther/unity-webxr-export" target="_blank" title="WebXR Export">WebXR Export</a></div>
        <div id="unity-build-title">webar-task7 v3</div>
      </div>
    </div>
    <div id="debug-log" style="position: fixed; top: 0; left: 0; right: 0; max-height: 50%; overflow: auto; background: rgba(0, 0, 0, 0.85); color: #ff8080; font: 12px monospace; white-space: pre-wrap; z-index: 10; display: none;"></div>
    <script>
      var createElementOriginal = document.createElement.bind(document);
      document.createElement = function (tagName, options) {
        var element = createElementOriginal(tagName, options);
        if (String(tagName).toLowerCase() === "script") {
          element.crossOrigin = "anonymous";
        }
        return element;
      };

      function showDebug(text) {
        var log = document.getElementById("debug-log");
        log.style.display = "block";
        log.textContent += text + "\n\n";
      }

      var consoleLines = [];
      ["log", "warn", "error"].forEach(function (level) {
        var original = console[level].bind(console);
        console[level] = function () {
          var text = Array.prototype.slice.call(arguments).join(" ");
          consoleLines.push(level + ": " + text.slice(0, 300));
          if (consoleLines.length > 15) {
            consoleLines.shift();
          }
          original.apply(null, arguments);
        };
      });

      window.addEventListener("error", function (event) {
        var stack = event.error && event.error.stack ? event.error.stack : event.filename + ":" + event.lineno + ":" + event.colno;
        showDebug((event.message || "error") + "\n" + stack + "\n\n" + navigator.userAgent + "\n\n" + consoleLines.join("\n"));
      });
      window.addEventListener("unhandledrejection", function (event) {
        showDebug("unhandledrejection: " + (event.reason && event.reason.stack ? event.reason.stack : event.reason));
      });
    </script>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webar-task7.loader.js?v=3";
      var config = {
        dataUrl: "https://cdn.jsdelivr.net/gh/kotel24/webar-task7@7cacbc767672fd017f3b5bd83e09173cd166dbb5/Build/webar-task7.data",
        frameworkUrl: buildUrl + "/webar-task7.framework.js?v=3",
        codeUrl: "https://rawcdn.githack.com/kotel24/webar-task7/7cacbc767672fd017f3b5bd83e09173cd166dbb5/Build/webar-task7.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "webar-task7",
        productVersion: "0.1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var canvasContainer = document.querySelector("#unity-canvas-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var unityInstance = null;


      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          loadingBar.style.display = "none";
          if (fullscreenButton)
          {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      let enterARButton = document.getElementById('enterar');
      let enterVRButton = document.getElementById('entervr');

      document.addEventListener('onARSupportedCheck', function (event) {
        enterARButton.disabled = !event.detail.supported;
      }, false);
      document.addEventListener('onVRSupportedCheck', function (event) {
        enterVRButton.disabled = !event.detail.supported;
      }, false);

      enterARButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleAR();
      }, false);
      enterVRButton.addEventListener('click', function (event) {
        unityInstance.Module.WebXR.toggleVR();
      }, false);
    </script>
  </body>
</html>
